<script>
async function loadOffers() {
    const container = document.getElementById("offersList");

    if (!container) return;

    container.innerHTML = `
        <div class="loading">
            Chargement des vidéos...
        </div>
    `;

    try {
        const data = await api("/api/offers");

        if (!data.offers || data.offers.length === 0) {
            container.innerHTML = `
                <div class="card">
                    <div class="empty">
                        🎬 Aucune vidéo disponible pour le moment.
                    </div>
                </div>
            `;
            return;
        }

        container.innerHTML = "";

        data.offers.forEach(offer => {

            const card = document.createElement("div");
            card.className = "offer";

            const title = document.createElement("div");
            title.className = "offer-title";
            title.textContent = "🎬 " + offer.title;

            const reward = document.createElement("div");
            reward.className = "offer-reward";
            reward.textContent =
                "💰 +" + Number(offer.reward).toFixed(2) + " €";

            card.appendChild(title);
            card.appendChild(reward);

            /* =========================
               VIDEO
            ========================= */

            if (offer.video_url && offer.video_url.trim() !== "") {

                const wrapper = document.createElement("div");
                wrapper.className = "video-wrapper";

                const video = document.createElement("video");

                video.controls = true;
                video.playsInline = true;
                video.preload = "metadata";
                video.src = offer.video_url;

                wrapper.appendChild(video);
                card.appendChild(wrapper);

                /* =========================
                   BOUTON RÉCOMPENSE
                ========================= */

                const rewardButton = document.createElement("button");

                rewardButton.className = "btn btn-green";

                rewardButton.textContent =
                    "🎁 RÉCUPÉRER LA RÉCOMPENSE";

                rewardButton.style.display = "none";

                card.appendChild(rewardButton);

                /* =========================
                   MESSAGE VIDÉO TERMINÉE
                ========================= */

                const finishedMessage =
                    document.createElement("div");

                finishedMessage.className = "completed";

                finishedMessage.textContent =
                    "🎉 Vidéo terminée ! Tu peux récupérer ta récompense.";

                finishedMessage.style.display = "none";

                card.appendChild(finishedMessage);

                /* =========================
                   FIN DE LA VIDÉO
                ========================= */

                video.addEventListener("ended", () => {

                    rewardButton.style.display = "block";

                    finishedMessage.style.display = "block";

                    video.controls = false;

                });

                /* =========================
                   RÉCUPÉRER LA RÉCOMPENSE
                ========================= */

                rewardButton.onclick = async () => {

                    rewardButton.disabled = true;

                    rewardButton.textContent =
                        "⏳ Récupération...";

                    try {

                        const result = await api(
                            "/api/complete",
                            {
                                method: "POST",

                                body: JSON.stringify({
                                    initData: initData,
                                    offer_id: offer.id
                                })
                            }
                        );

                        if (currentUser) {
                            currentUser.balance =
                                result.balance;
                        }

                        updateBalance();

                        rewardButton.remove();

                        finishedMessage.textContent =
                            "✅ Récompense récupérée : +" +
                            Number(result.reward).toFixed(2) +
                            " €";

                        finishedMessage.style.display =
                            "block";

                        showMessage(
                            "offersMessage",
                            "🎉 +" +
                            Number(result.reward).toFixed(2) +
                            " € ajoutés à ton solde !",
                            "success"
                        );

                    } catch (error) {

                        rewardButton.disabled = false;

                        rewardButton.textContent =
                            "🎁 RÉCUPÉRER LA RÉCOMPENSE";

                        showMessage(
                            "offersMessage",
                            "❌ " + error.message,
                            "error"
                        );
                    }
                };

            } else {

                const info =
                    document.createElement("div");

                info.className = "offer-info";

                info.textContent =
                    "🎬 Aucune vidéo disponible pour cette offre.";

                card.appendChild(info);
            }

            container.appendChild(card);
        });

    } catch (error) {

        container.innerHTML = `
            <div class="card">
                <div class="empty">
                    ❌ Impossible de charger les vidéos.
                </div>
            </div>
        `;
    }
}
</script>
